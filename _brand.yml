color:
  palette:
    blue: "#073e66"
    orange: "#f65f33"
    ink: "#22303c"
  # Body text is `ink`, not `blue`. With foreground set to blue, every
  # paragraph on the site rendered in #073e66, which is why pages read as a
  # wall of blue. Blue stays as `primary`, for links and headings.
  foreground: ink
  primary: blue
  secondary: orange

typography:
  fonts:
    - family: Lato
      source: google
  base: Lato
  headings: Lato
