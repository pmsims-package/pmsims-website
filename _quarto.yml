project:
  type: website
  output-dir: docs
  # Copied into docs/ on every render. Neither file is generated from a source
  # document, so without this a clean rebuild silently drops them: CNAME is what
  # points pmsims.com at GitHub Pages, and .nojekyll stops Pages running the
  # output through Jekyll. Keep the originals in the project root.
  resources:
    - CNAME
    - .nojekyll

website:
  title: "pmsims"
  navbar:
    search: false
    collapse: true
    background: primary
    pinned: true
    left:
      - href: index.qmd#about
        text: About
      - href: team.qmd
        text: Team
      - href: index.qmd#contact
        text: Contact
      - href: news.qmd
        text: News
    right:
      - href: https://pmsims-package.github.io/pmsims/
        text: R package
    tools:
      - icon: github
        href: https://github.com/pmsims-package/pmsims
        text: GitHub

format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: true
    markdown:
      extensions: [fenced-divs]
